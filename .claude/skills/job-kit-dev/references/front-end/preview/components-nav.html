<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sidebar nav</title>
    <link rel="stylesheet" href="./preview.css" />
    <script src="./shard.js" defer></script>
    <style>
      /* app-sidebar.tsx header + sidebar.tsx SidebarMenuButton, translated 1:1 */
      .nav-rail {
        width: 256px;
        background: var(--sidebar);
        color: var(--sidebar-foreground);
        border: 1px solid var(--sidebar-border);
      }
      .nav-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px;
        border-bottom: 1px solid var(--sidebar-border);
      }
      .nav-header img {
        width: 28px;
        height: 28px;
        object-fit: contain;
        flex-shrink: 0;
      }
      .nav-wordmark {
        font: 700 14px var(--font-logo);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--sidebar-foreground);
      }
      .nav-body {
        display: flex;
        flex-direction: column;
        gap: 0;
        padding: 4px;
      }
      /* sidebarMenuButtonVariants: rounded-[6px] p-2 gap-2 h-8 text-sm, hover/active both bg-sidebar-accent */
      .nav-row {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 8px;
        border-radius: 6px;
        font: 400 14px var(--font-sans);
        color: var(--sidebar-foreground);
        text-decoration: none;
      }
      .nav-row svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .nav-row:hover,
      .nav-row.is-hover {
        background: var(--sidebar-accent);
        color: var(--sidebar-accent-foreground);
      }
      /* data-active:bg-sidebar-accent data-active:font-medium data-active:text-sidebar-accent-foreground */
      .nav-row.is-active {
        background: var(--sidebar-accent);
        color: var(--sidebar-accent-foreground);
        font-weight: 500;
      }

      .state-caption {
        font: 500 11px var(--font-mono);
        color: var(--ink-muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 4px 0 2px 8px;
      }
    </style>
  </head>
  <body>
    <p class="eyebrow">Sidebar nav — active, idle, hover</p>

    <div class="nav-rail">
      <div class="nav-header">
        <img class="theme-light-only" src="../../../../../../packages/frontend/public/brand/mascot-mark.svg" alt="" />
        <img
          class="theme-dark-only"
          src="../../../../../../packages/frontend/public/brand/mascot-mark-dark.svg"
          alt=""
        />
        <span class="nav-wordmark">Job Kit AI</span>
      </div>

      <div class="nav-body">
        <span class="state-caption">Active</span>
        <a class="nav-row is-active" href="#">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="7" height="7" />
            <rect x="14" y="3" width="7" height="7" />
            <rect x="14" y="14" width="7" height="7" />
            <rect x="3" y="14" width="7" height="7" />
          </svg>
          Home
        </a>

        <span class="state-caption">Idle</span>
        <a class="nav-row" href="#">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4 7h16M4 12h16M4 17h10" />
          </svg>
          Dossiers
        </a>

        <span class="state-caption">Hover (forced)</span>
        <a class="nav-row is-hover" href="#">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <path d="M14 2v6h6" />
          </svg>
          Resumes
        </a>

        <a class="nav-row" href="#">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M17 6.1H3M21 12.1H3M15.1 18.1H3" />
          </svg>
          Recommendations
        </a>
      </div>
    </div>
  </body>
</html>
