<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Empty state</title>
    <link rel="stylesheet" href="./preview.css" />
    <script src="./shard.js" defer></script>
    <style>
      /* permission-empty.tsx: grid place-items-center px-6 py-12, max-w-100 column, size-56 image */
      .empty-wrap {
        display: grid;
        place-items: center;
        padding: 32px 24px;
      }
      .empty-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        max-width: 400px;
      }
      .empty-inner img {
        width: 224px;
        height: 224px;
        object-fit: contain;
      }
      .empty-title {
        padding-top: 12px;
        font: 600 16px var(--font-sans);
        color: var(--foreground);
      }
      .empty-body {
        padding-top: 4px;
        font: 14px var(--font-sans);
        color: var(--muted-foreground);
      }
      .empty-actions {
        display: flex;
        width: 100%;
        gap: 8px;
        padding-top: 24px;
      }
      /* button.tsx size="lg" -> h-9, className="h-9 flex-1" overrides to full-width in this layout */
      .empty-actions .btn {
        flex: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 36px;
        padding: 0 10px;
        border: 1px solid transparent;
        font: 500 14px var(--font-sans);
        cursor: pointer;
      }
      .empty-actions .btn-default {
        background: var(--primary);
        color: var(--primary-foreground);
      }
      .empty-actions .btn-outline {
        background: var(--background);
        color: var(--ink-soft);
        border-color: var(--border);
      }
      .dark .empty-actions .btn-outline {
        border-color: var(--input);
        background: color-mix(in srgb, var(--input) 30%, transparent);
      }
    </style>
  </head>
  <body>
    <p class="eyebrow">Empty state — PermissionEmpty</p>
    <div class="empty-wrap">
      <div class="empty-inner">
        <img src="../../../../../../packages/frontend/public/permission-not-granted.png" alt="" />
        <h1 class="empty-title">Permission not granted</h1>
        <p class="empty-body">Your dossiers are on this machine, but this page has no folder selected yet.</p>
        <div class="empty-actions">
          <button class="btn btn-default">Choose profile folder</button>
          <button class="btn btn-outline">Review permissions</button>
        </div>
      </div>
    </div>
  </body>
</html>
