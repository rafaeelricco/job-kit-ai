# Resume Check (job-kit-ai/mcp): per-address request rate for the MCP endpoint (SPEC D-8, NFR-7).
# Claude and ChatGPT call from shared provider addresses, so this is per provider address, not per user.
limit_req_zone $binary_remote_addr zone=resume_check:10m rate=120r/m;
# A slow file server can hold a scan for up to 15 s; capping concurrent MCP requests per address keeps one
# client from occupying the server's download pool (16) or scan pool (4) on its own.
limit_conn_zone $binary_remote_addr zone=resume_check_conn:10m;
