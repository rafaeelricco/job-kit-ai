# Resume Check MCP server and its public pages (rafaeelricco/job-kit-ai, mcp/).
# Include inside the r1cco.com server block. Claims only /job-kit-ai and the
# OpenAI domain-verification path. Installed by mcp/deploy/remote_install.sh.

location = /job-kit-ai {
    return 301 /job-kit-ai/;
}

location = /job-kit-ai/mcp {
    access_log off;
    limit_req zone=resume_check burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:3020/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:3020;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
}

location = /job-kit-ai/healthz {
    access_log off;
    proxy_pass http://127.0.0.1:3020/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:3020;
    proxy_set_header Connection "";
}

location ^~ /job-kit-ai/ {
    access_log off;
    alias /opt/resume-check/current/mcp/site/;
    index index.html;
    autoindex off;
    charset utf-8;
    expires 10m;
}

# Exact token from the OpenAI plugin portal, written on the VPS only.
location = /.well-known/openai-apps-challenge {
    alias /etc/resume-check/openai-apps-challenge;
    default_type text/plain;
    charset utf-8;
}
