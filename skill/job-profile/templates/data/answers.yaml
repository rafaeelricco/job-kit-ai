# Answers to form questions that no other file covers.
# Read by job-apply. Written by /job-profile qa and job-apply.
#
#   qa[]           Answered questions: question, answer, scope?, source,
#                  confirmed_at. The question must match the form label.
#
#   pending[]      Questions seen but not answered yet. Never used on a form.
#
#   scope          Limits a row to one {company}, {ats}, or {country}.
#
# Empty means unknown. Never invent a value.
# A fact in another file always beats a row here.
# "Professional" years count paid roles only.

qa: [] # each: {question, answer, scope?, source, confirmed_at}
pending: [] # each: {question, scope?, source, confirmed_at}
