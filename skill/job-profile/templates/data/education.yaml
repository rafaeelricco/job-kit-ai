# One entry per degree or certificate.
# Read by job-apply, job-resume-review.
#
#   institution    School or issuer, as printed.
#
#   credential     Degree or certificate name.
#
#   level          Level as forms list it, e.g. "Bachelor's degree".
#
#   grade          Final grade, if you want it given.
#
#   field          Field of study.
#
#   date           "Mon. YYYY -- Mon. YYYY", or just the end date.
#
#   coursework[]   Graded course projects: name, date, description[].
#
# Empty means unknown. Never invent a value or guess a start date.

[]
