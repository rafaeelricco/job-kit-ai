# Who you are and how to reach you, for application forms.
# Read by job-apply, job-scout, job-match.
#
#   name              Display name, e.g. "Rafael Ricco".
#
#   legal_name        Full name as on your ID.
#
#   birth_date        YYYY-MM-DD. Given only when a form requires it.
#
#   email, phone      Application contact details.
#
#   phone_whatsapp    true if the phone number is on WhatsApp.
#
#   location          "City, State, Country" as you'd print it.
#
#   country           Country you live in.
#
#   address.*         line1, line2, district, postal_code. City and state
#                     come from location.
#
#   citizenships      Countries you are a citizen of.
#
#   permits           Other countries where you may work (visa, permit, PR).
#
#   timezone          IANA name, e.g. America/Sao_Paulo.
#
#   url               Personal site: label and href.
#
# Empty means unknown. Never invent a value.
# Never store ID numbers or passport details.

name: "{{display_name}}"
legal_name: ""
birth_date: ""
email: "{{email}}"
phone: ""
phone_whatsapp: false
location: ""
country: "" # country of residence as a form lists it, e.g. "Brazil"
address:
  line1: ""
  line2: ""
  district: ""
  postal_code: ""
citizenships: [] # confirmed citizenship countries; never inferred from residence
permits: [] # beyond citizenships; empty → citizenships only
timezone: ""
url:
  label: "Website"
  href: ""
