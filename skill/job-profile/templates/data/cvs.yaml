# The CV job-apply attaches.
# Read by job-apply, job-resume-refine, job-resume-review.
#
#   base                 PDF file name under cv/. Its .tex twin is what
#                        job-resume-refine edits.
#
#   adapt_per_vacancy    true → tailor the CV for each job.
#                        false → send base as is. Absent means true.
#
# Empty base → cv/en-us-resume.pdf is sent.

base: ""
adapt_per_vacancy: true
