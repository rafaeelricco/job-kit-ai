# Search constraints for job-scout. Scout preflight stops on any other valued key.
# Keys: work_model, job_types, date_posted, positions, location,
#   market_currencies, exclude_companies, prune_score_max
#
# How a search is constrained, and why:
#
#   [positions × formulations] + [location.search_in] + [work_model / job_types / date_posted]
#
#   work_model         remote / hybrid / onsite flags. Scout keep uses kit-true flags.
#   job_types          full_time, contract, and the other printed types.
#   date_posted        one window: 24_hours, week, month, or all_time.
#   positions          title strings; [role] and board title-match use this list,
#                      file order.
#   location           where scout searches and who can hire you:
#     search_in          markets to search, one run each, or `worldwide` for one
#                        unfiltered run. An onsite posting must sit in one. This is
#                        not where you may work (candidate.yaml legal_authorization
#                        is). Empty → scout STOP.
#     also_eligible_from regions that include you when a posting says "hiring
#                        from X", on top of your Yes jurisdictions (e.g. LATAM).
#                        Worldwide / anywhere / global postings always qualify.
#     exclude_hire_from  hire-from places to drop. Empty → drop none.
#   market_currencies  salary currencies the gate keeps (USD, EUR, GBP).
#   exclude_companies  company names dropped at search and gate, slug-compared.
#                      Empty → drop none.
#   prune_score_max    job-prune threshold; scout ignores it.
#
#   Rules: bool maps are explicit.

work_model:
  remote: false
  hybrid: false
  onsite: false

job_types:
  full_time: false
  contract: false
  part_time: false
  temporary: false
  internship: false
  other: false
  volunteer: false

date_posted:
  all_time: false
  month: false
  week: false
  24_hours: false

positions: [] # confirm target titles; empty → Gap until set

location:
  search_in: [] # markets to search, or worldwide; empty → scout STOP until set
  also_eligible_from: [] # hire-from regions that include you (e.g. LATAM); empty → jurisdictions only
  exclude_hire_from: [] # hire-from places to drop (e.g. Brazil); empty → none
market_currencies: [] # e.g. USD, EUR, GBP; empty → no markets prose
exclude_companies: [] # company names to drop at search and gate, slug-compared; empty → none
prune_score_max: 5 # job-prune: dossiers scored at or below this move to scout/jobs/.trash/
