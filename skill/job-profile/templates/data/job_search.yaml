# What job-scout searches for, and the facts job-apply answers forms with.
# Read by job-scout, job-match, job-apply, job-profile.
#
#   work_model               remote, hybrid, onsite (true | false).
#
#   job_types                full_time, contract, part_time, … (true | false).
#
#   date_posted              One window: 24_hours, week, month, or all_time.
#
#   positions                Job titles to search, in priority order.
#
#   location.search_in       Markets to search, or worldwide.
#
#   location.exclude_hire_from
#                            Hiring places to skip, e.g. ["United States"].
#
#   market_currencies        Salary currencies to keep, e.g. [USD, EUR].
#
#   exclude_companies        Companies to never show.
#
#   prune_score_max          Dossiers scoring at or below this are trashed.
#
#   employment_routes.*      How you can be hired: employer_of_record,
#                            direct_contractor, local_employment (Yes | No),
#                            contractor_entity (free text).
#
#   salary_expectations.*    salary_range_usd (yearly, "min-max"), bonus, equity.
#
#   salary_history.last      Last pay: amount, currency, period, basis.
#
#   availability.*           notice_period, open_to_relocation, and Yes | No
#                            answers: on_call, travel, drug_test, …
#
#   consents.*               Optional checkboxes (Yes | No). Required privacy
#                            boxes are always ticked.
#
# Empty means unknown. Never invent a value.
# Scout stops on any key not listed here.

work_model:
  remote: false
  hybrid: false
  onsite: false

job_types:
  full_time: false
  contract: false
  part_time: false
  temporary: false
  internship: false
  other: false
  volunteer: false

date_posted:
  all_time: false
  month: false
  week: false
  24_hours: false

positions: [] # confirm target titles; empty → Gap until set

location:
  search_in: [] # markets to search, or worldwide; empty → scout STOP until set
  exclude_hire_from: [] # hire-from places to drop (e.g. Brazil); empty → none
market_currencies: [] # e.g. USD, EUR, GBP; empty → no markets prose
exclude_companies: [] # company names to drop at search and gate, slug-compared; empty → none
prune_score_max: 5 # job-prune: dossiers scored at or below this move to scout/jobs/.trash/

# No self-identification block, deliberately. EEO / demographic questions are
# voluntary and per-employer; answer them in the ATS form at apply time.
# No kit skill stages protected-class data from a file.

employment_routes:
  employer_of_record: "" # Yes | No: gates EOR report eligibility
  direct_contractor: ""
  local_employment: "" # Yes | No: hired onto a local payroll in the posting's country
  contractor_entity: "" # e.g. Yes | No | Can open one if required; never the number

salary_expectations:
  salary_range_usd: "" # TODO e.g. "80000-120000"
  bonus: ""
  equity: ""

salary_history:
  last: { amount: "", currency: "", period: "", basis: "" } # e.g. 82000 USD year base

availability:
  notice_period: "" # TODO e.g. "2 weeks"
  open_to_relocation: ""
  on_call: ""
  hours_overlap: ""
  working_hours: ""
  background_check: ""
  technical_assessment: ""
  drug_test: ""
  in_person_interview: ""
  travel: ""
  own_equipment: ""
  equipment_os: []

consents:
  recruiter_messages: ""
  data_retention: ""
  interview_recording: ""
  marketing_use: ""
