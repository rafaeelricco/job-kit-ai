# Where job-scout searches: one pack per site.
# Read by job-scout. Absent → scout stops.
#
#   id                Unique name. Packs run in file order.
#
#   surface           linkedin-jobs | open-web | social | careers | other.
#
#   entry             The URL the search starts from.
#
#   formulations[]    Search lines. [role] becomes each job_search position;
#                     [industry] comes from your profile. Absent → ["[role]"].
#
#   enabled           false → kept in the file but skipped. Absent → true.
#
#   location          keep-only → the site's location filter is not used;
#                     scout filters results itself. Only you set this.
#
#   route_required    true → the site can only be searched through route.
#
#   route             Explicit API or careers-listing route.
#                     kind json: url with {formulation} and {page}, plus
#                     pages, items, posting_url.
#                     kind board: ats, url with {slug}, plus items,
#                     posting_url, title, optional slug_lists.
#                     kind careers: official company careers page; requires
#                     surface careers and location: keep-only.
#   boards[]          Optional company boards for a kind: board pack. Each row
#                     has company_id, name, and a verified ATS board-root url;
#                     enabled defaults true, managed_by may be job-company-scout.
#
# One pack is one site, not one employer, except surface: careers,
# which must be keep-only.

packs:
  - id: hn-hiring
    surface: open-web
    entry: https://hnhiring.com
    # Location slugs are cities and Remote; kit country names never match.
    location: keep-only

  - id: work-at-a-startup
    surface: open-web
    entry: https://www.workatastartup.com/companies?demographic=any&hasEquity=any&hasSalary=any&industry=any&interviewProcess=any&jobType=fulltime&layout=list-compact&role=eng&sortBy=created_desc&tab=any&usVisaNotRequired=true
    # The location control does not persist a country; the view stays Remote.
    location: keep-only

  - id: wellfound
    surface: open-web
    entry: https://wellfound.com

  - id: we-work-remotely
    surface: open-web
    entry: https://weworkremotely.com
    # country[] has no Anywhere option; a country filter hides worldwide cards.
    location: keep-only

  - id: remote-ok
    surface: open-web
    entry: https://remoteok.com

  - id: ashby-boards
    surface: open-web
    entry: https://jobs.ashbyhq.com
    route_required: true
    route:
      kind: board
      ats: ashby
      url: https://api.ashbyhq.com/posting-api/job-board/{slug}?includeCompensation=true
      items: jobs
      posting_url: jobUrl
      title: title
      location: location
      date: publishedAt
      listed: isListed

  - id: greenhouse-boards
    surface: open-web
    entry: https://job-boards.greenhouse.io
    route_required: true
    route:
      kind: board
      ats: greenhouse
      url: https://boards-api.greenhouse.io/v1/boards/{slug}/jobs?content=true
      items: jobs
      posting_url: absolute_url
      title: title
      location: location.name
      date: first_published

  # Large-company list (market-research enriched CSV). Set csv, then enable.
  - id: companies-uk-us-eu
    surface: companies
    enabled: false
    location: keep-only
    route_required: true
    route:
      kind: companies
      csv: /path/to/top_1500_companies_enriched.csv
      regions: [UK, US, EU]
      tiers: [A]

# Company discovery is explicit through /job-company-scout. Its state belongs
# here; company discovery never starts a job search or application workflow.
discovery:
  markets:
    uk:
      enabled: true
      scope: Companies headquartered in the United Kingdom
      sources:
        cambridge:
          url: https://www.enterprise.cam.ac.uk/stories/
          strategy: news
        setsquared:
          url: https://setsquared-bristol.co.uk/news/
          strategy: news
        entrepreneur-first:
          url: https://www.joinef.com/portfolio/
          strategy: portfolio
        seedcamp-companies:
          url: https://seedcamp.com/our-companies/
          strategy: portfolio
        seedcamp-news:
          url: https://seedcamp.com/views/
          strategy: news
        balderton:
          url: https://www.balderton.com/news/category/portfolio-news/
          strategy: news
    us:
      enabled: true
      scope: Companies headquartered in the United States
      sources:
        yc-companies:
          url: https://www.ycombinator.com/companies
          strategy: portfolio
        south-park-commons:
          url: https://www.southparkcommons.com/companies
          strategy: portfolio
        a16z-portfolio:
          url: https://a16z.com/portfolio/
          strategy: portfolio
        accel-news:
          url: https://www.accel.com/news/portfolio
          strategy: news
    eu:
      enabled: true
      scope: Companies headquartered in a European Union member state
      sources:
        tech-eu:
          url: https://tech.eu/feed/
          strategy: news
        sifted:
          url: https://sifted.eu/feed/?post_type=article
          strategy: news
  observations: {}
  companies: {}
