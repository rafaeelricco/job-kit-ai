# Your public profiles.
# Read by job-apply and job-prep (form fields named after the network).
#
#   network     LinkedIn, GitHub, Twitter, …
#
#   username    Your handle there.
#
#   url         Full profile link.
#
# Empty means unknown. Never invent a handle.

profiles:
  - network: "LinkedIn"
    username: "{{linkedin_username}}"
    url: "https://www.linkedin.com/in/{{linkedin_username}}/"
  - network: "GitHub"
    username: "{{github_username}}"
    url: "https://github.com/{{github_username}}"
