# The Job Kit backend stack. Run it through an overlay:
#   dev   docker compose -f compose.yaml -f compose.dev.yaml ...
#   CI    docker compose -f compose.yaml -f compose.dev.yaml -f compose.ci.yaml ...
#   prod  docker compose -f compose.yaml -f compose.prod.yaml ...   (deploy-server.yml)
# Overlays only add settings. On its own, this file behaves like production:
# the built image, no source mount.
services:
  api:
    build:
      context: ../../..
      dockerfile: packages/backend/Dockerfile
    command: pnpm start
    environment:
      PORT: 8080
      EVENT_STORE_HOST: postgres
      EVENT_STORE_PORT: 5432
      EVENT_STORE_DATABASE: notepad_events
      EVENT_STORE_USER: notepad
      EVENT_STORE_CREATE_TABLE_WITH_NAME: event_store
      EVENT_STORE_CREATE_REPLICATION_USER_WITH_USERNAME: notepad_replication
      EVENT_STORE_CREATE_REPLICATION_USER_WITH_PASSWORD: local_notepad_replication
      EVENT_STORE_CREATE_REPLICATION_PUBLICATION: notepad_publication
      MONGODB_PROJECTION_HOST: mongo
      MONGODB_PROJECTION_PORT: 27017
      MONGODB_PROJECTION_AUTH_DB: admin
      MONGODB_PROJECTION_DATABASE: notepad_projections
      MONGODB_PROJECTION_USER: notepad
      MONGODB_PROJECTION_REPLICA_SET: rs0
      EVENT_BUS_USERNAME: notepad_event_bus
      EVENT_BUS_PASSWORD: local_notepad_event_bus
      ENGINE_OPERATOR_URL: http://postie:8081
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MAIL_FROM: ${MAIL_FROM:-Job Kit <login@localhost>}
    ports:
      - "127.0.0.1:${API_PORT:-3010}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/docker_healthcheck').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: notepad
      POSTGRES_DB: notepad_events
    command: postgres -c wal_level=logical
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notepad -d notepad_events"]
      interval: 3s
      timeout: 3s
      retries: 30
  mongo:
    image: mongo:7.0.14
    environment:
      MONGO_INITDB_ROOT_USERNAME: notepad
    entrypoint: ["bash", "/job-kit/mongo-entrypoint.sh"]
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/data/configdb/mongo.key", "--auth"]
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./mongo/entrypoint.sh:/job-kit/mongo-entrypoint.sh:ro
      - ./mongo/healthcheck.sh:/job-kit/mongo-healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "bash", "/job-kit/mongo-healthcheck.sh"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 15s
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - postie-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
  connect:
    image: quay.io/debezium/connect:3.0.0.Final
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: notepad-connect
      CONFIG_STORAGE_TOPIC: notepad-connect-configs
      OFFSET_STORAGE_TOPIC: notepad-connect-offsets
      STATUS_STORAGE_TOPIC: notepad-connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      HEAP_OPTS: "-Xmx768m -Xms256m"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors"]
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 30s
  control-postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: control
      POSTGRES_PASSWORD: control
      POSTGRES_DB: control
    volumes:
      - postie-control-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control -d control"]
      interval: 3s
      timeout: 3s
      retries: 30
  postie-provision:
    image: ghcr.io/rafaeelricco/postie:0.1.0
    entrypoint: ["postiectl"]
    command: ["provision", "--config", "/config/postie.yaml", "--generation", "${POSTIE_GENERATION:-1}"]
    volumes:
      - ./postie/postie.yaml:/config/postie.yaml:ro
      - ./postie/application.yaml:/config/application.yaml:ro
    depends_on:
      api:
        condition: service_healthy
      kafka:
        condition: service_healthy
      connect:
        condition: service_healthy
      control-postgres:
        condition: service_healthy
    healthcheck:
      disable: true
  postie:
    image: ghcr.io/rafaeelricco/postie:0.1.0
    command: ["--config", "/config/postie.yaml", "--generation", "${POSTIE_GENERATION:-1}"]
    volumes:
      - ./postie/postie.yaml:/config/postie.yaml:ro
      - ./postie/application.yaml:/config/application.yaml:ro
    depends_on:
      postie-provision:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
volumes:
  postgres-data:
  mongo-data:
  mongo-config:
  postie-kafka-data:
  postie-control-data:
