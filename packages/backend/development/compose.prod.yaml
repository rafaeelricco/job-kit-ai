# Production, applied on the VPS by .github/workflows/deploy-server.yml. Only the API has a host port
# (127.0.0.1:3010); nginx proxies /api/ to it and refuses /api/dev/ and the
# projection push path, whose postie credentials are the dev defaults.
name: job-kit-api
services:
  api:
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_URL: https://r1cco.com/jobs/
      EVENT_STORE_PASSWORD: ${EVENT_STORE_PASSWORD:?set in /etc/job-kit/api.env}
      MONGODB_PROJECTION_PASSWORD: ${MONGODB_PROJECTION_PASSWORD:?set in /etc/job-kit/api.env}
      ENGINE_OPERATOR_TOKEN: ${ENGINE_OPERATOR_TOKEN:?set in /etc/job-kit/api.env}
      SMTP_URL: ${SMTP_URL:?set in /etc/job-kit/api.env}
      LOGIN_CODE_SECRET: ${LOGIN_CODE_SECRET:?set in /etc/job-kit/api.env}
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${EVENT_STORE_PASSWORD:?set in /etc/job-kit/api.env}
  mongo:
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PROJECTION_PASSWORD:?set in /etc/job-kit/api.env}
  kafka:
    restart: unless-stopped
  connect:
    restart: unless-stopped
  control-postgres:
    restart: unless-stopped
  postie:
    restart: unless-stopped
    environment:
      POSTIE_OPERATOR_TOKEN: ${ENGINE_OPERATOR_TOKEN:?set in /etc/job-kit/api.env}
