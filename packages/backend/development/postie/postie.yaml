version: 1
namespace: notepad
environment: development
application_config: /config/application.yaml
kafka:
  brokers: [kafka:9092]
  partitions: 10
  replication_factor: 1
connect:
  url: http://connect:8083
operator:
  listen: 0.0.0.0:8081
  token_file: ""
control:
  database_url: postgres://control:control@control-postgres:5432/control?sslmode=disable
delivery:
  request_timeout: 60s
  drain_timeout: 30s
destinations:
  Note_Projection_Notes:
    kind: projection
sources:
  postgres_source:
    publication: notepad_publication
