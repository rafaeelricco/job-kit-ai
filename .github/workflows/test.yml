name: CI

on:
  push:
    branches: ["**"]
    paths:
      - "skill/**"
      - "scripts/**"
      - "tests/**"
      - ".gitattributes"
      - "LICENSE"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pyrightconfig.json"
      - ".github/workflows/test.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "skill/**"
      - "scripts/**"
      - "tests/**"
      - ".gitattributes"
      - "LICENSE"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pyrightconfig.json"
      - ".github/workflows/test.yml"
      - ".github/workflows/release.yml"
  workflow_call:
    inputs:
      ref:
        description: Exact commit to verify
        required: false
        type: string

jobs:
  release_types:
    if: github.repository == 'rafaeelricco/job-kit-ai' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: r1cco-ci
    name: Release automation types
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v4
        with:
          version: "10.33.0"

      - name: Install development dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release automation types
        run: pnpm typecheck:release

  pipeline:
    if: github.repository == 'rafaeelricco/job-kit-ai' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # setup-python ships no 3.9 build for ubuntu-26.04, which ubuntu-latest now resolves to.
    runs-on: r1cco-ci
    strategy:
      fail-fast: false
      matrix:
        # The skills claim any Python 3 works and run under whatever `python3`
        # an operator happens to have. The matrix is what makes that claim true.
        python-version: ["3.9", "3.11", "3.13"]
    name: Python ${{ matrix.python-version }} test suite
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          # Full history and tags, so the packaging test can compare the
          # required-file lists with the latest release tag's.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Report Python version
        run: python3 -VV

      - name: Install Company Scout test dependency
        run: python -m pip install -r skill/job-company-scout/scripts/requirements.txt

      - name: Run full test suite
        run: bash scripts/test.sh

  shell:
    if: github.repository == 'rafaeelricco/job-kit-ai' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: r1cco-ci
    name: Shell script syntax
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Validate shell script syntax
        run: |
          status=0
          for script in scripts/*.sh scripts/aside/*.sh scripts/agents/*.sh scripts/browser-use/*.sh; do
            [ -e "$script" ] || continue
            bash -n "$script" || status=1
          done
          exit $status

  release_installers:
    if: github.repository == 'rafaeelricco/job-kit-ai' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        # Native macOS/Windows installer coverage is disabled; this pool is Linux VPS only.
        os: [ubuntu-latest]
    runs-on: r1cco-ci
    name: Release installers (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Company Scout test dependency
        run: python -m pip install -r skill/job-company-scout/scripts/requirements.txt

      - name: Test Company Scout workflow
        run: python -m unittest discover -s skill/job-company-scout/scripts -p 'test_*.py'

      - name: Test release packaging and native installers
        run: python -m unittest discover -s tests -p test_release.py

      - name: Test browser channel native installers
        run: python -m unittest discover -s tests -p test_browser_install.py
