name: Claude review

# Reviews each pull request once, when it opens or leaves draft, with the repo's
# pr-review skill (.claude/skills/pr-review): parallel agents find candidates,
# separate agents prove each one by running code, and only reproduced findings
# are posted. Comment "/pr-review" on a PR to review its new head. Runs are
# billed to the Claude subscription behind CLAUDE_CODE_OAUTH_TOKEN, so it skips
# synchronize. Fork PRs never run: the agent executes PR code with broad tools.

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' &&
        !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/pr-review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    # Job-level, so a comment whose job is skipped never cancels a running review.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    name: Claude review
    timeout-minutes: 45
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      # Strips CLAUDE_CODE_OAUTH_TOKEN and Actions credentials from every command
      # Claude runs, since those commands execute PR code. It also forces the
      # default permission mode, so access comes from --allowedTools below.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
      # The action stops at Claude's first result message, abandoning any
      # subagent still running in the background: PR #153 posted nothing and
      # PR #152 posted a summary before its finders returned. Foreground only.
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
    steps:
      # issue_comment runs with secrets even on fork PRs; refuse them before any
      # PR code is checked out.
      - name: Refuse fork pull requests
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fork=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)
          if [ "$fork" != "false" ]; then
            echo "::error::/pr-review does not run on fork pull requests"
            exit 1
          fi

      # The PR head, not the merge ref, so line numbers match the diff.
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          fetch-depth: 1

      # Provers run the repo's checks and throwaway tests with pnpm, on the Node
      # version in .node-version. pr-review installs
      # dependencies into its own review tree, so none are installed here.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # The subprocess secret scrub needs bubblewrap, which the action installs
      # only for allowed_non_write_users. Same setup as its own step.
      - name: Install bubblewrap for the subprocess scrub
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          # Ubuntu 24.04+ restricts unprivileged user namespaces via AppArmor.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # claude-code-action@v1 pins Claude Code 2.1.278, which predates Opus 5.5
      # (2.1.280+). Install our own CLI, update it if it is older than that, and
      # hand it to the action. Drop this step once the action's pin reaches 2.1.280.
      - name: Ensure Claude Code 2.1.280+
        run: |
          min=2.1.280
          claude="$HOME/.local/bin/claude"
          [ -x "$claude" ] || curl -fsSL https://claude.ai/install.sh | bash
          version() { "$claude" --version | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' || true; }
          older() { [ "$(printf '%s\n' "$1" "$min" | sort -V | head -n1)" != "$min" ]; }
          current=$(version)
          if older "$current"; then
            echo "Claude Code ${current:-unknown} is older than $min; running claude update"
            "$claude" update
            current=$(version)
          fi
          if older "$current"; then
            echo "::error::Claude Code ${current:-unknown} is older than $min, which Opus 5.5 needs"
            exit 1
          fi
          echo "Using Claude Code $current"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: /home/runner/.local/bin/claude
          show_full_output: true
          # Claude's app token can comment but not push, since PR code runs here.
          additional_permissions: |
            contents: read
            pull_requests: write
            issues: write
          prompt: "/pr-review --comment ${{ github.repository }}/pull/${{ env.PR_NUMBER }}"
          # Broad on purpose: finders read anything, provers write and run
          # throwaway tests. Subagents inherit this list.
          claude_args: '--model claude-opus-5-5 --effort high --allowedTools "Agent,Task,Bash,Read,Write,Edit,Glob,Grep,TodoWrite,mcp__github_inline_comment__create_inline_comment"'
