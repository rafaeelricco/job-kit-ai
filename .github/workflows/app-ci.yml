name: App CI

# The app is not covered by test.yml: its paths filter is workflow-wide, so
# adding packages/frontend/** there would run the Python and installer matrices for a change
# that cannot affect them. This workflow is the app's own gate, and it runs on
# GitHub-hosted infrastructure so that pull request code never executes on the
# self-hosted deployment runner.

on:
  push:
    branches: ["**"]
    paths:
      - "packages/frontend/**"
      - "packages/backend/src/**"
      - "packages/backend/package.json"
      - "packages/lib/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - ".node-version"
      - ".github/workflows/app-ci.yml"
  pull_request:
    paths:
      - "packages/frontend/**"
      - "packages/backend/src/**"
      - "packages/backend/package.json"
      - "packages/lib/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - ".node-version"
      - ".github/workflows/app-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: App build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10.33.0"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        # One workspace install: the frontend compiles the backend's `.api.ts` files, whose imports need its packages.
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: packages/frontend
        run: pnpm lint

      - name: Typecheck
        # tsc --build at the root: the frontend (with the backend source it compiles), the backend, and lib.
        run: pnpm typecheck

      - name: Build
        working-directory: packages/frontend
        run: pnpm build
