name: Deploy server

on:
  push:
    branches: [main]
    paths:
      - "packages/backend/**"
      - "packages/lib/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - ".node-version"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

permissions:
  contents: read

# Distinct from job-kit-app-production: the SPA and the API deploy independently.
concurrency:
  group: job-kit-server-production
  cancel-in-progress: false
  queue: max

jobs:
  quality:
    # GitHub-hosted, same steps as server-ci.yml's quality job, so nothing
    # ships that fails the gate. Not reused through workflow_call: a manual
    # dispatch would also start server-ci.yml's dispatch-only jobs.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter @job-kit/backend...
        working-directory: .
      - run: pnpm quality

  deploy:
    needs: quality
    # Same runner as deploy-app.yml. r1cco-runner is in the docker group, so
    # this job is root-equivalent on the VPS: never trigger it from pull_request.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/backend
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build and start the stack
        # Secrets come from /etc/job-kit/api.env on the VPS (see packages/backend/README.md).
        # Volumes belong to project job-kit-api; never run `down -v` on it.
        # --wait blocks until every healthcheck passes, so a broken API fails the run.
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p job-kit-api --env-file /etc/job-kit/api.env \
            -f development/compose.yaml -f development/compose.prod.yaml \
            up --build --detach --wait --wait-timeout 600 --remove-orphans

      - name: Remove superseded images
        run: docker image prune --force
