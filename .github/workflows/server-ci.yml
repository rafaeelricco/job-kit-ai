name: Server quality

on:
  pull_request:
    paths:
      - "packages/backend/**"
      - "packages/lib/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - ".node-version"
      - ".github/workflows/server-ci.yml"
  push:
    paths:
      - "packages/backend/**"
      - "packages/lib/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - ".node-version"
      - ".github/workflows/server-ci.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Fast quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter @job-kit/backend...
        working-directory: .
      - name: Run fast quality gates
        run: pnpm quality
      - name: Write quality summary
        if: always()
        run: pnpm quality:report
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/backend/reports/**
          if-no-files-found: warn
          retention-days: 14

  mutation:
    name: Mutation score
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter @job-kit/backend...
        working-directory: .
      - name: Run mutation tests
        run: pnpm test:mutation
      - name: Write quality summary
        if: always()
        run: pnpm quality:report
      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-mutation-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/backend/reports/**
          if-no-files-found: warn
          retention-days: 14

  coverage-all:
    name: Informational all-source coverage
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter @job-kit/backend...
        working-directory: .
      - name: Measure all-source coverage
        run: pnpm test:coverage:all
      - name: Write quality summary
        if: always()
        run: pnpm quality:report
      - name: Upload all-source coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage-all-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/backend/reports/**
          if-no-files-found: warn
          retention-days: 14

  docker-tests:
    name: Docker integration
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter @job-kit/backend...
        working-directory: .
      - name: Choose an isolated Compose project
        run: echo "COMPOSE_PROJECT=server-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Run Docker-backed integration tests
        shell: bash
        run: |
          if [[ -z "${COMPOSE_PROJECT:-}" || "$COMPOSE_PROJECT" != "server-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]]; then
            echo "A unique CI Compose project was not configured; refusing to use the default project."
            exit 1
          fi
          compose=(docker compose -p "$COMPOSE_PROJECT" -f development/compose.yaml -f development/compose.dev.yaml -f development/compose.ci.yaml)
          if "${compose[@]}" up --build --detach --wait --remove-orphans; then
            # Recreate containers while retaining volumes to verify Kafka persistence.
            "${compose[@]}" down
            "${compose[@]}" up --detach --wait --remove-orphans
            stack_status=0
            if "${compose[@]}" exec -T api pnpm test:integration; then
              integration_status=0
            else
              integration_status=$?
            fi
          else
            stack_status=$?
            integration_status=125
          fi
          printf 'Compose status: %s\nIntegration status: %s\n' "$stack_status" "$integration_status"
          if [ "$stack_status" -ne 0 ] || [ "$integration_status" -ne 0 ]; then
            exit 1
          fi
      - name: Collect logs and reports before cleanup
        if: always()
        shell: bash
        run: |
          artifact_dir="$RUNNER_TEMP/server-ci-artifacts"
          mkdir -p "$artifact_dir" reports
          if [[ -z "${COMPOSE_PROJECT:-}" || "$COMPOSE_PROJECT" != "server-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]]; then
            echo "A unique CI Compose project was not configured; skipping Compose collection."
            exit 1
          fi
          compose=(docker compose -p "$COMPOSE_PROJECT" -f development/compose.yaml -f development/compose.dev.yaml -f development/compose.ci.yaml)
          "${compose[@]}" logs --no-color > "$artifact_dir/docker-compose.log" 2>&1 || true
          api_container=$("${compose[@]}" ps -aq api 2>/dev/null | head -n 1)
          if [ -n "$api_container" ]; then
            docker cp "$api_container:/app/packages/backend/reports/." reports/ 2> "$artifact_dir/report-copy.log"
          fi
          pnpm quality:report
      - name: Remove the isolated Compose project and its volumes
        if: always()
        shell: bash
        run: |
          if [[ -z "${COMPOSE_PROJECT:-}" || "$COMPOSE_PROJECT" != "server-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]]; then
            echo "A unique CI Compose project was not configured; refusing cleanup without an explicit project."
            exit 1
          fi
          docker compose -p "$COMPOSE_PROJECT" -f development/compose.yaml -f development/compose.dev.yaml -f development/compose.ci.yaml down --volumes --remove-orphans
      - name: Upload Docker test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-docker-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            packages/backend/reports/**
            ${{ runner.temp }}/server-ci-artifacts/**
          if-no-files-found: warn
          retention-days: 14
